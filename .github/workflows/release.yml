name: Release

# Se dispara al publicar un tag "vX.Y.Z" (ej. git tag v0.2.0 && git push
# --tags). Compila el instalador de Windows y lo publica como asset del
# GitHub Release, para que UpdateChecker lo encuentre automaticamente.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer version del tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Extraer el changelog del mensaje del tag
        id: notes
        shell: pwsh
        run: |
          $msg = (git tag -l --format="%(contents)" "${{ github.ref_name }}") -join "`n"
          if ([string]::IsNullOrWhiteSpace($msg)) { $msg = "Inventario ${{ steps.version.outputs.version }}." }
          "notes<<INVENTARIO_EOF" >> $env:GITHUB_OUTPUT
          $msg >> $env:GITHUB_OUTPUT
          "INVENTARIO_EOF" >> $env:GITHUB_OUTPUT

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          arch: "win64_msvc2022_64"

      - name: Configurar entorno de MSVC (cl.exe, rc.exe)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Instalar Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configurar CMake
        shell: pwsh
        run: cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DINVENTARIO_VERSION_OVERRIDE=${{ steps.version.outputs.version }}"

      - name: Compilar
        shell: pwsh
        run: cmake --build build-release --target Inventario

      - name: Correr pruebas unitarias
        shell: pwsh
        run: |
          cmake --build build-release --target InventoryEngineTest CutoffEngineTest UpdateCheckerTest SkuGeneratorTest
          ctest --test-dir build-release --output-on-failure

      - name: Empaquetar dependencias de Qt (windeployqt)
        shell: pwsh
        run: windeployqt --release --no-translations --no-opengl-sw build-release\Inventario.exe

      - name: Quitar drivers de SQL sin usar (solo SQLite)
        shell: pwsh
        run: |
          Get-ChildItem build-release\sqldrivers -Filter "*.dll" |
            Where-Object { $_.Name -ne "qsqlite.dll" } |
            Remove-Item -Force

      - name: Armar carpeta de distribucion limpia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build-release\Inventario.exe dist
          Get-ChildItem build-release -Filter "*.dll" | ForEach-Object { Copy-Item $_.FullName dist }
          foreach ($sub in @("platforms","sqldrivers","styles","imageformats","iconengines","generic","networkinformation","tls")) {
            $src = "build-release\$sub"
            if (Test-Path $src) { Copy-Item $src "dist\$sub" -Recurse }
          }

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar el instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\setup.iss'

      - name: Publicar el Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: installer\output\InventarioSetup-${{ steps.version.outputs.version }}.exe
          body: ${{ steps.notes.outputs.notes }}
